# Fly.io — a single always-on machine.
#
#   fly auth login                              # you, once (opens a browser)
#   fly launch --no-deploy --name switchboard-hub --region sjc --copy-config
#   fly deploy --remote-only                    # no local Docker needed
#
# Then, from a laptop that has the demo repo:
#   export SB_HUB_URL=https://switchboard-hub.fly.dev
#   ./client/install.sh /path/to/demo-repo
#   npm run derive-contracts -- /path/to/demo-repo $SB_HUB_URL
app = "switchboard-hub"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  # See the Dockerfile: a deployed hub cannot read the demo repo, so the contract
  # registry is pushed with `npm run derive-contracts` instead of scanned.
  SB_SKIP_DERIVE = "1"
  LEASE_TTL_MS = "600000"

[http_service]
  internal_port = 8787
  force_https = true

  # ALL THREE OF THESE MATTER.
  #
  # Leases live in memory (§12). A stopped machine loses every lease in the room,
  # and a SECOND machine would hold a second, independent lease table — granting
  # the same file to two different people, which is precisely the failure this
  # product exists to prevent.
  #
  # Scaling past one machine requires the Redis store in src/store.ts. Until then:
  # one machine, never auto-stopped.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
