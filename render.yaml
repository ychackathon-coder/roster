# Render blueprint — one long-running web service.
#
#   1. Push this repo
#   2. Render dashboard -> New -> Blueprint -> pick this repo
#   3. Copy the assigned URL into SB_HUB_URL on every laptop
#
# CRITICAL: numInstances stays 1. Switchboard holds leases in memory, so two
# instances behind a load balancer would each grant the same file to a different
# person — the exact failure the product exists to prevent. Scale up only after
# adding a Redis store (see src/store.ts).
services:
  - type: web
    name: switchboard-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT; do not override it.
      - key: LEASE_TTL_MS
        value: "600000"
      # Optional. Absent means deterministic mode: fast path, contract drift,
      # sequencing, TTL, and L1 all work; adjudicator and semantic pass go quiet.
      - key: ANTHROPIC_API_KEY
        sync: false
